<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%LINK_PREVIEW_DESCRIPTION%" />
    <!-- Link previews. The %…% values are filled in from src/content.ts when
         building, and SITE_URL is the address of the site being deployed. -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%LINK_PREVIEW_SITE_NAME%" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%LINK_PREVIEW_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%LINK_PREVIEW_IMAGE_DESCRIPTION%" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
